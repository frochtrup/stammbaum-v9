name: CI & Deploy
on:
  push:
    branches: [main, v9-dev]
  pull_request:
    branches: [main]
  # Handstart über die Actions-Oberfläche ("Run workflow", Branch wählbar).
  #
  # WARUM: am 2026-08-06 hatte GitHub Actions eine Störung und drosselte Webhooks auf
  # ~15 % — der Merge von PR #11 auf `main` löste deshalb KEINEN Lauf aus, und ohne Lauf
  # keinen Deploy: `deploy` hängt an `needs: test` und `github.ref == refs/heads/main`.
  # Live blieb der Stand von PR #10, bis ein leerer Commit auf `main` das Push-Ereignis
  # nachreichte. Ein Handstart hätte dafür genügt.
  #
  # Der naheliegende Griff hilft in dieser Lage NICHT: "Re-run all jobs" auf dem letzten
  # `main`-Lauf checkt dessen Commit aus — also den ALTEN Stand — und deployt ihn erneut.
  # Genau das passierte am 2026-08-07 um 06:07 unbemerkt.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Action-Versionen: die LAUFZEIT der Actions selbst, nicht die des Projekts.
#
# Node 20 ist im April 2026 aus der Wartung gefallen; seit dem 16.06.2026 starten die
# Runner Actions standardmäßig auf Node 24 und melden für jede Action, die noch `node20`
# deklariert, eine Warnung („being forced to run on Node.js 24"). Im Herbst 2026 entfernt
# GitHub Node 20 ganz — dann laufen diese Actions nicht mehr, die Warnung ist also eine
# Frist, keine Geschmacksfrage. Deshalb stehen hier die Majors, die `runs.using: node24`
# deklarieren (am 2026-08-14 an der jeweiligen `action.yml` nachgesehen, nicht geraten):
# checkout v7 · setup-node v7 · upload-pages-artifact v5 · deploy-pages v5.
#
# Zwei Bruchstellen dieser Majors betreffen uns NICHT, beide geprüft: checkout v5+ sperrt
# den Fork-Checkout bei `pull_request_target`/`workflow_run` (wir triggern auf `push` und
# `pull_request`), und setup-node v5+ cacht von sich aus, wenn `package.json` ein
# `packageManager`-Feld trägt — wir sagen ohnehin ausdrücklich `cache: npm`.
#
# `node-version` unten ist eine ANDERE Frage: das ist die Node-Version, mit der gebaut und
# getestet wird. Sie erzeugt keine Warnung, ist aber ebenfalls Node 20 — s. Notiz dort.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        # Node 20 ist EOL (April 2026), und lokal läuft das Gate auf Node 24 — CI prüft
        # damit eine andere Laufzeit als die, auf der entwickelt wird. Bewusst noch nicht
        # angehoben: das ist eine Änderung am Prüfgegenstand, keine Wartung der Actions.
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run check:arch
      - run: npm run check:csp
      # Barrierefreiheits-Gate (Spec 32 TST-15). Eigener Schritt, eigene Vitest-Config:
      # der Scanner braucht `sequence.hooks: 'list'`, damit er den DOM VOR dem Aufräumen
      # durch @testing-library sieht — im Hauptlauf mitzuschalten hieße, die
      # Hook-Reihenfolge aller 1.771 Tests zu ändern. Der Wrapper schreibt die erreichte
      # Reichweite ins Log und schlägt an, wenn sie einbricht (grün ohne Reichweite).
      - run: npm run check:a11y
      # Das Editor-Handbuch ist ein Extrakt (Spec 22 §8) — ein veralteter Extrakt faellt
      # sonst niemandem auf, weil ihn niemand liest, bevor er ausgeliefert ist.
      - run: npm run check:handbuch-orte
      - run: npm run lint
      - run: npm test
      # Eigener Schritt, eigene Vitest-Config: die Haupt-Config schließt tests/perf/ aus
      # (Pre-Commit-Tauglichkeit, Spec 32 §2) — ein Pfad-Argument gegen sie fände null
      # Tests und meldete grün. Hält u. a. den 20k-Skalen-Test scharf, der seit BL-47
      # der Wächter gegen einen Rückfall des Orts-Resolvers ist (ADR-v9-88).
      - run: npm run test:perf

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }
      - uses: actions/deploy-pages@v5
