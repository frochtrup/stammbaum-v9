name: CI & Deploy
on:
  push:
    branches: [main, v9-dev]
  pull_request:
    branches: [main]
  # Handstart über die Actions-Oberfläche ("Run workflow", Branch wählbar).
  #
  # WARUM: am 2026-08-06 hatte GitHub Actions eine Störung und drosselte Webhooks auf
  # ~15 % — der Merge von PR #11 auf `main` löste deshalb KEINEN Lauf aus, und ohne Lauf
  # keinen Deploy: `deploy` hängt an `needs: test` und `github.ref == refs/heads/main`.
  # Live blieb der Stand von PR #10, bis ein leerer Commit auf `main` das Push-Ereignis
  # nachreichte. Ein Handstart hätte dafür genügt.
  #
  # Der naheliegende Griff hilft in dieser Lage NICHT: "Re-run all jobs" auf dem letzten
  # `main`-Lauf checkt dessen Commit aus — also den ALTEN Stand — und deployt ihn erneut.
  # Genau das passierte am 2026-08-07 um 06:07 unbemerkt.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run check:arch
      - run: npm run check:csp
      # Barrierefreiheits-Gate (Spec 32 TST-15). Eigener Schritt, eigene Vitest-Config:
      # der Scanner braucht `sequence.hooks: 'list'`, damit er den DOM VOR dem Aufräumen
      # durch @testing-library sieht — im Hauptlauf mitzuschalten hieße, die
      # Hook-Reihenfolge aller 1.771 Tests zu ändern. Der Wrapper schreibt die erreichte
      # Reichweite ins Log und schlägt an, wenn sie einbricht (grün ohne Reichweite).
      - run: npm run check:a11y
      # Das Editor-Handbuch ist ein Extrakt (Spec 22 §8) — ein veralteter Extrakt faellt
      # sonst niemandem auf, weil ihn niemand liest, bevor er ausgeliefert ist.
      - run: npm run check:handbuch-orte
      - run: npm run lint
      - run: npm test
      # Eigener Schritt, eigene Vitest-Config: die Haupt-Config schließt tests/perf/ aus
      # (Pre-Commit-Tauglichkeit, Spec 32 §2) — ein Pfad-Argument gegen sie fände null
      # Tests und meldete grün. Hält u. a. den 20k-Skalen-Test scharf, der seit BL-47
      # der Wächter gegen einen Rückfall des Orts-Resolvers ist (ADR-v9-88).
      - run: npm run test:perf

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - uses: actions/deploy-pages@v4
